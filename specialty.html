<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abad X | التخصص</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/academy.css"></head><body>
<a class="skip" href="#main">تخطَّ إلى المحتوى</a>
<nav class="topbar" aria-label="مسار التنقل"><div class="crumb"><a href="portal.html">البوابة</a> / <a href="academy.html">الأكاديمية</a> / <span aria-current="page" id="cr"></span></div><a class="back" href="academy.html">→ التخصصات · Specialties</a></nav>
<main id="main"><header class="head" id="hd"></header><ul class="grid" id="list" aria-label="الجهات المانحة للشهادات"></ul></main>
<footer>جميع العلامات التجارية والشعارات مملوكة لأصحابها · All trademarks and logos belong to their respective owners<br>© 2026 Abad X</footer>
<script src="assets/academy-data.js?v=2"></script><script>
const id=new URLSearchParams(location.search).get('s'),s=SPECIALTIES.find(x=>x.id===id),L=document.getElementById('list'),H=document.getElementById('hd');
if(!s){document.getElementById('cr').textContent='غير موجود';H.innerHTML='<div class="wm" aria-hidden="true">Abad <b>X</b></div><h1>التخصص غير موجود <span class="en">Specialty not found</span></h1>';L.outerHTML='<div class="empty">لم يتم العثور على هذا التخصص. <a href="academy.html">العودة إلى التخصصات</a></div>'}
else{document.title='Abad X | '+s.ar;document.getElementById('cr').textContent=s.ar;
H.innerHTML=`${emblem(s.icon).replace('class="emb"','class="emb" style="margin:0 auto 10px;width:84px;height:84px"')}<h1>${s.ar} <span class="en">${s.en}</span></h1><p>${s.dar} · ${s.vendors.length} جهات مانحة</p>`;
L.innerHTML=s.vendors.map(v=>`<li><a class="sc vc" href="vendor.html?s=${s.id}&v=${v.id}">${badge(v)}<h2>${v.name}</h2><p>${v.ar}</p><ul class="tags" aria-label="الشهادات">${v.certs.slice(0,4).map(c=>`<li class="tag">${c.code}</li>`).join('')}${v.certs.length>4?`<li class="tag more">+${v.certs.length-4}</li>`:''}</ul><div class="meta"><span>${v.certs.length} شهادات · certifications</span><span class="go" aria-hidden="true">ENTER &gt;</span></div></a></li>`).join('')}
</script></body></html>
