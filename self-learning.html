<title>Abad X | تعلّم ذاتي</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css?v=3">
<style>
:root{--mono:'JetBrains Mono',ui-monospace,monospace;--b:#38bdf8;--mut:#8aa0c2;--ok:#4ade80}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,rgba(29,111,255,.24),transparent 55%),#03060c;color:var(--txt)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.8))}
.topbar{position:relative;z-index:10;display:flex;align-items:center;gap:12px;padding:14px clamp(16px,4vw,40px);font-size:.9rem;color:var(--mut)}
.topbar img{height:30px}.topbar a{color:#9fb6d8}.topbar a:hover{color:var(--b)}.topbar .crumb{margin-inline-start:6px}
main{position:relative;z-index:2;max-width:1120px;margin:auto;padding:20px clamp(16px,4vw,40px) 70px}
.head{text-align:center;margin:10px auto 28px}
.head h1{margin:0;font-size:clamp(1.8rem,5vw,2.8rem)}.head h1 .en{display:block;font-family:var(--mono);font-size:1rem;color:var(--mut);letter-spacing:.12em;margin-top:6px}
.head p{color:#bcd3f5;max-width:640px;margin:14px auto 0;line-height:1.9}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 28px}
.chips button{font:inherit;font-size:.85rem;display:inline-flex;align-items:center;gap:8px;background:rgba(10,18,34,.66);border:1px solid rgba(56,189,248,.22);color:#bcd3f5;border-radius:999px;padding:7px 14px;cursor:pointer;transition:.2s}
.chips button[aria-selected=true]{border-color:var(--b);color:#eaf6ff;box-shadow:0 0 20px rgba(56,189,248,.28);background:rgba(56,189,248,.12)}
.chips button svg{width:18px;height:18px;stroke:var(--b);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sec{margin:0 0 36px}.sec[hidden]{display:none}
.sec-head{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.sec-head .emb{width:48px;height:48px;filter:drop-shadow(0 0 8px rgba(56,189,248,.55))}
.sec-head .emb .fr{fill:rgba(56,189,248,.06);stroke:#38bdf8;stroke-width:1.5;stroke-linejoin:round}
.sec-head .emb .fr2{fill:none;stroke:#38bdf8;stroke-opacity:.25;stroke-width:1}
.sec-head .emb .gl{fill:none;stroke:#bfe9ff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sec-head h2{margin:0;font-size:1.35rem}.sec-head h2 .en{display:block;font-family:var(--mono);font-size:.78rem;color:var(--mut);direction:ltr;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.room{position:relative;display:block;color:#dbeafe;padding:22px;border-radius:18px;background:rgba(10,18,34,.66);backdrop-filter:blur(12px);border:1px solid rgba(56,189,248,.2);box-shadow:inset 0 0 30px rgba(47,140,255,.05);transition:transform .25s,border-color .25s,box-shadow .25s}
.room:hover,.room:focus-visible{transform:translateY(-4px);border-color:var(--b);box-shadow:0 0 40px rgba(56,189,248,.3);outline:none}
.room .ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);margin-bottom:14px}
.room .ic svg{width:30px;height:30px;fill:none;stroke:var(--b);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.room h3{margin:0;font-size:1.2rem}.room h3 .en{display:block;font-family:var(--mono);font-size:.78rem;color:var(--mut);direction:ltr;text-align:right;margin-top:2px}
.room p{color:#a9c3e6;margin:10px 0 0;line-height:1.8;font-size:.92rem}
.rmeta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px}
.pill{font-size:.74rem;border:1px solid rgba(120,160,220,.28);border-radius:999px;padding:3px 10px;color:#bcd3f5}
.pill.dif{border-color:var(--ok);color:var(--ok)}
.pbar{height:7px;border-radius:99px;background:rgba(56,189,248,.12);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#38bdf8);box-shadow:0 0 10px var(--b);transition:width .6s}
.pct{display:flex;justify-content:space-between;font-size:.74rem;color:var(--mut);font-family:var(--mono);margin-top:6px}
.done-badge{position:absolute;top:16px;left:16px;font-size:.72rem;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:2px 10px;display:none}
.room.done .done-badge{display:inline-block}
footer{position:relative;z-index:2;text-align:center;color:#51688c;font-size:.8rem;padding:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav class="topbar"><img src="assets/abadx-logo.svg" alt="Abad X"><span class="crumb"><a href="portal.html" data-i18n="common.portal">البوابة</a> / <span aria-current="page" data-i18n="common.self">تعلّم ذاتي</span></span></nav>
<main>
<header class="head"><h1>تعلّم ذاتي <span class="en">Self-Learning</span></h1>
<p>غرف تدريب عملية تفاعلية مصنّفة حسب التخصص — مختبرات داخل المتصفح، مهام، وأعلام ABADX{...}. اختر تخصصاً أو تصفّح الكل.</p></header>
<div class="chips" id="chips" role="tablist" aria-label="تصفية حسب التخصص" data-i18n-aria="sl.filter"></div>
<div id="sections"></div>
</main>
<footer>© 2026 Abad X</footer>
<script>
const ICONS={
net:'<circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="18" r="2.2"/><circle cx="12" cy="13" r="1.6"/><path d="M12 7.2v4.2M10.7 14 6.6 16.6M13.3 14l4.1 2.6"/>',
sec:'<path d="M12 3 19 6v5.2c0 4.4-2.9 7.9-7 9.8-4.1-1.9-7-5.4-7-9.8V6z"/><rect x="9" y="11" width="6" height="5" rx="1"/><path d="M10.2 11V9.6a1.8 1.8 0 0 1 3.6 0V11"/>',
sys:'<rect x="4" y="3" width="16" height="5" rx="1.5"/><rect x="4" y="10" width="16" height="5" rx="1.5"/><path d="M7.5 5.5h.01M7.5 12.5h.01M11 5.5h5.5M11 12.5h5.5M12 15v3M7 21v-3h10v3"/>',
data:'<ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v5c0 1.4 3.1 2.5 7 2.5M19 5.5v4"/><path d="M5 10.5v5c0 1.4 3.1 2.5 6 2.5"/><path d="m15 14-2.5 2.5L15 19M18 14l2.5 2.5L18 19"/>'
};
const SECTIONS=[
 {id:'networking',icon:'net',ar:'الشبكات',en:'Networking'},
 {id:'cybersecurity',icon:'sec',ar:'الأمن السيبراني',en:'Cybersecurity'},
 {id:'systems',icon:'sys',ar:'الأنظمة',en:'Systems'},
 {id:'programming',icon:'data',ar:'البرمجة',en:'Programming'}
];
const ROOMS=[
 {id:'networking-basics',sec:'networking',ar:'أساسيات الشبكات',en:'Networking Basics',dif:['مبتدئ','Beginner'],min:55,tasks:6,
  desc:'OSI/TCP-IP، العناوين وSubnetting مع حاسبة تفاعلية، DNS، HTTP والمنافذ.',
  icon:ICONS.net},
 {id:'wireshark',sec:'networking',ar:'تحليل الحزم بـ Wireshark',en:'Packet Analysis with Wireshark',dif:['مبتدئ','Beginner'],min:50,tasks:5,
  desc:'عارض حزم وهمي مع فلاتر ip.addr و http و dns وتحليل طلبات مشبوهة.',
  icon:'<path d="M3 12c4-6 10-8 18-6-2 2-3 4-3 6s1 4 3 6c-8 2-14 0-18-6z"/><circle cx="8" cy="12" r="1"/>'},
 {id:'nmap',sec:'cybersecurity',ar:'استكشاف الشبكات بـ Nmap',en:'Network Discovery with Nmap',dif:['مبتدئ','Beginner'],min:50,tasks:6,
  desc:'محاكاة Nmap: اكتشاف مضيفين، مسح منافذ، -sV و -O وسكربتات على شبكة وهمية.',
  icon:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'},
 {id:'web-basics-burp',sec:'cybersecurity',ar:'أساسيات الويب والبروكسي',en:'Web Basics & Proxy',dif:['مبتدئ','Beginner'],min:55,tasks:6,
  desc:'HTTP والكوكيز واعتراض/تكرار الطلبات على تطبيق متجر محاكى.',
  icon:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'},
 {id:'owasp-top10',sec:'cybersecurity',ar:'مدخل إلى OWASP Top 10',en:'OWASP Top 10 Intro',dif:['مبتدئ','Beginner'],min:60,tasks:6,
  desc:'ودجات محاكاة آمنة: SQLi و XSS و IDOR ومصادقة ضعيفة.',
  icon:'<path d="M12 3 4 7v5c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V7z"/><path d="M9 12h6M12 9v6"/>'},
 {id:'crypto-hashing',sec:'cybersecurity',ar:'التشفير والتجزئة والترميز',en:'Crypto, Hashing & Encoding',dif:['مبتدئ','Beginner'],min:50,tasks:6,
  desc:'Base64 وقيصر وSHA-256 وكسر هاش مقابل قائمة كلمات محلية.',
  icon:'<path d="M10 4v16M14 4v16M5 9h14M5 15h14"/>'},
 {id:'soc-analyst-intro',sec:'cybersecurity',ar:'مدخل محلل العمليات الأمنية',en:'SOC Analyst Intro',dif:['مبتدئ','Beginner'],min:55,tasks:6,
  desc:'عارض سجلات auth/web/fw — اكتشف brute force وعناوين مشبوهة.',
  icon:'<path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h5"/><circle cx="17" cy="14" r="1"/>'},
 {id:'linux-fundamentals',sec:'systems',ar:'أساسيات لينكس',en:'Linux Fundamentals',dif:['مبتدئ','Beginner'],min:45,tasks:7,
  desc:'تنقّل في نظام الملفات، اقرأ وأدِر الملفات، ابحث داخلها، وافهم الصلاحيات.',
  icon:'<path d="M9 3h6l1 4a7 7 0 0 1 2 5v4a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-4a7 7 0 0 1 2-5z"/><circle cx="10" cy="11" r="1.1"/><circle cx="14" cy="11" r="1.1"/><path d="M10.5 15h3"/>'},
 {id:'linux-fundamentals-2',sec:'systems',ar:'لينكس متقدم: عمليات وصلاحيات وCron',en:'Linux Fundamentals II',dif:['مبتدئ','Beginner'],min:55,tasks:6,
  desc:'العمليات، SUID/sticky، وجدولة cron في طرفية محاكاة.',
  icon:'<path d="M9 3h6l1 4a7 7 0 0 1 2 5v4a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-4a7 7 0 0 1 2-5z"/><circle cx="10" cy="11" r="1.1"/><circle cx="14" cy="11" r="1.1"/><path d="M10.5 15h3"/>'},
 {id:'bash-scripting',sec:'systems',ar:'سكربتات Bash',en:'Bash Scripting',dif:['مبتدئ','Beginner'],min:55,tasks:6,
  desc:'متغيرات وشروط وحلقات وتشغيل سكربتات حقيقية داخل الطرفية.',
  icon:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m8 9 3 3-3 3M13 15h4"/>'},
 {id:'windows-powershell',sec:'systems',ar:'ويندوز و PowerShell',en:'Windows PowerShell',dif:['مبتدئ','Beginner'],min:50,tasks:6,
  desc:'Get-ChildItem و Get-Process و Get-Service و Get-LocalUser مع Where/Select.',
  icon:'<path d="M3 5h8v6H3zM13 5h8v6h-8zM3 13h8v6H3zM13 13h8v6h-8z"/>'},
 {id:'python-for-security',sec:'programming',ar:'بايثون للأمن السيبراني',en:'Python for Security',dif:['مبتدئ','Beginner'],min:60,tasks:6,
  desc:'محرر بايثون في المتصفح (Pyodide): منافذ، hashing، base64، وتخمين محلي.',
  icon:'<path d="M12 3c-3 0-4 1.5-4 4v2h8V7c0-2.5-1-4-4-4zM8 13v2c0 2.5 1 4 4 4s4-1.5 4-4v-2H8z"/><circle cx="10" cy="5.5" r=".7"/><circle cx="14" cy="16.5" r=".7"/>'}
];
function progOf(id){try{const st=JSON.parse(localStorage.getItem('abadx_room_'+id)||'{}');if(st.complete)return 100;if(st.pts&&st.maxpts)return Math.min(99,Math.round(st.pts/st.maxpts*100));if(st.solved)return Math.min(99,Math.round(Object.keys(st.solved).length/12*100));}catch(e){}return 0}
function card(r){const prog=progOf(r.id),done=prog>=100;
 return `<a class="room${done?' done':''}" href="room.html?r=${r.id}"><span class="done-badge" data-i18n="sl.done">مكتملة ✓</span><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${r.icon}</svg></span>
  <h3>${r.ar} <span class="en">${r.en}</span></h3><p>${r.desc}</p>
  <div class="rmeta"><span class="pill dif">● ${r.dif[0]} · ${r.dif[1]}</span><span class="pill">⏱ ${r.min} دقيقة</span><span class="pill">${r.tasks} مهام</span></div>
  <div class="pbar"><i style="width:${prog}%"></i></div><div class="pct"><span data-i18n="common.progress">التقدّم</span><span>${prog}%</span></div></a>`}
const chips=document.getElementById('chips'),sections=document.getElementById('sections');
const emblem=k=>`<svg class="emb" viewBox="0 0 64 64" aria-hidden="true"><path class="fr" d="M32 3.5 56.7 17.75v28.5L32 60.5 7.3 46.25v-28.5z"/><path class="fr2" d="M32 9 52 20.5v23L32 55 12 43.5v-23z"/><g class="gl" transform="translate(14 14) scale(1.5)">${ICONS[k]}</g></svg>`;
chips.innerHTML=`<button type="button" aria-selected="true" data-f="all">الكل · All</button>`+SECTIONS.map(s=>`<button type="button" aria-selected="false" data-f="${s.id}"><svg viewBox="0 0 24 24">${ICONS[s.icon]}</svg>${s.ar}</button>`).join('');
sections.innerHTML=SECTIONS.map(s=>{
 const rooms=ROOMS.filter(r=>r.sec===s.id);
 return `<section class="sec" data-sec="${s.id}" aria-labelledby="h-${s.id}"><div class="sec-head">${emblem(s.icon)}<h2 id="h-${s.id}">${s.ar} <span class="en">${s.en}</span></h2></div><div class="grid">${rooms.map(card).join('')}</div></section>`;
}).join('');
chips.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 [...chips.children].forEach(x=>x.setAttribute('aria-selected',x===b));
 const f=b.dataset.f;[...sections.children].forEach(sec=>{sec.hidden=f!=='all'&&sec.dataset.sec!==f})});
</script><script src="assets/i18n.js"></script></body></html>
