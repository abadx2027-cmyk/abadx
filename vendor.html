<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abad X | الجهة</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css?v=4"><link rel="stylesheet" href="assets/academy.css?v=4"></head><body>
<a class="skip" href="#main">تخطَّ إلى المحتوى</a>
<nav class="topbar" aria-label="مسار التنقل"><div class="crumb"><a href="portal.html">البوابة</a> / <a href="academy.html">الأكاديمية</a> / <a id="sp" href="academy.html"></a> / <span aria-current="page" id="cr"></span></div><a class="back" id="bk" href="academy.html">→ رجوع · Back</a></nav>
<main id="main"><header class="head" id="hd"></header><section class="rm" id="rm" aria-labelledby="rmh" hidden></section><ul class="grid" id="list" aria-label="الشهادات"></ul></main>
<footer>جميع العلامات التجارية والشعارات مملوكة لأصحابها · All trademarks and logos belong to their respective owners<br>© 2026 Abad X</footer>
<script src="assets/academy-data.js?v=4"></script><script>
const q=new URLSearchParams(location.search),s=SPECIALTIES.find(x=>x.id===q.get('s')),vd=s&&s.vendors.find(x=>x.id===q.get('v')),L=document.getElementById('list'),H=document.getElementById('hd');
if(!vd){document.getElementById('sp').remove();document.getElementById('cr').textContent='غير موجود';H.innerHTML='<div class="wm" aria-hidden="true">Abad <b>X</b></div><h1>الجهة غير موجودة <span class="en">Vendor not found</span></h1>';L.outerHTML='<div class="empty">لم يتم العثور على هذه الجهة. <a href="academy.html">العودة إلى الأكاديمية</a></div>'}
else{document.title='Abad X | '+vd.name;const sp=document.getElementById('sp');sp.textContent=s.ar;sp.href='specialty.html?s='+s.id;document.getElementById('bk').href=sp.href;document.getElementById('cr').textContent=vd.name;
H.innerHTML=`${badge(vd,true)}<h1 class="vn">${vd.name}</h1><p>${vd.ar}<span class="en">${s.ar} · ${s.en} · ${vd.certs.length} certifications</span></p>
<div class="filter" role="group" aria-label="تصفية حسب المستوى · Filter by level"><button type="button" data-f="" aria-pressed="true">الكل · All <b>${vd.certs.length}</b></button>${Object.keys(LEVELS).map(k=>{const n=vd.certs.filter(c=>c.lvl===k).length;return n?`<button type="button" class="f${k}" data-f="${k}" aria-pressed="false">${LEVELS[k][0]} · ${LEVELS[k][1]} <b>${n}</b></button>`:''}).join('')}</div>`;
L.innerHTML=vd.certs.map(c=>`<li data-l="${c.lvl}"><article class="sc cc"><div class="row"><span class="lvl l${c.lvl}">${LEVELS[c.lvl][0]} · ${LEVELS[c.lvl][1]}</span><span class="soon">قريباً</span></div><h2 class="code">${c.code}</h2><p class="full">${c.full}</p><p class="off">المستوى الرسمي · Official level: <bdi>${c.official}</bdi></p><p>${c.ar}</p></article></li>`).join('');
const st=document.createElement('p');st.className='sr';st.setAttribute('aria-live','polite');H.append(st);
H.querySelectorAll('.filter button').forEach(b=>b.onclick=()=>{const f=b.dataset.f;H.querySelectorAll('.filter button').forEach(x=>x.setAttribute('aria-pressed',x===b));let n=0;L.querySelectorAll('li').forEach(li=>{const show=!f||li.dataset.l===f;li.hidden=!show;n+=show});st.textContent=`عرض ${n} شهادة`});const qf=q.get('f');if(qf){const b=H.querySelector(`.filter button[data-f="${qf}"]`);b&&b.click()}}
if(/(^|[?&])still(=|&|$)/.test(location.search))document.body.classList.add('still');
if(vd){const R=document.getElementById('rm'),order=['B','I','A'],tiers=order.filter(k=>vd.certs.some(c=>c.lvl===k));let i=0;
const esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
R.innerHTML=`<h2 id="rmh">مسار الشهادات <span class="en">Certification Roadmap</span></h2><p class="hint">من المبتدئ إلى المتقدم · Beginner → Advanced — اختر شهادة للانتقال إلى بطاقتها</p><div class="rm-wrap"><svg class="rm-svg" aria-hidden="true" focusable="false"><path class="rm-base"/><path class="rm-glow"/></svg><ol class="rm-stages" style="--n:${tiers.length}" aria-label="مراحل المسار · Roadmap stages">${tiers.map((k,si)=>{const cs=vd.certs.map((c,ix)=>[c,ix]).filter(([c])=>c.lvl===k);return `<li class="rm-stage"><div class="rm-sh l${k}" id="rms${k}">المرحلة ${si+1}: ${LEVELS[k][0]} <span class="ct">(${cs.length})</span><span class="en">Stage ${si+1} · ${LEVELS[k][1]}</span></div><ol class="rm-nodes" aria-labelledby="rms${k}">${cs.map(([c,ix])=>{i++;return `<li><button type="button" class="rm-node l${k}" style="--i:${i}" data-ix="${ix}" aria-label="الخطوة ${i} من ${vd.certs.length}: ${esc(c.code)} — ${esc(c.full)} (${LEVELS[k][0]} · ${LEVELS[k][1]}). الانتقال إلى البطاقة"><span class="dot" aria-hidden="true">${i}</span><span class="tx"><span class="cd">${esc(c.code)}</span><span class="nm">${esc(c.full)}</span></span></button></li>`}).join('')}</ol></li>`}).join('')}</ol></div>`;
R.hidden=false;const W=R.querySelector('.rm-wrap'),P=R.querySelectorAll('path');
const draw=()=>{const b=W.getBoundingClientRect(),pts=[...R.querySelectorAll('.rm-node .dot')].map(d=>{const r=d.getBoundingClientRect();return[r.left+r.width/2-b.left,r.top+r.height/2-b.top]});if(!pts.length)return;
let d=`M${pts[0][0]},${pts[0][1]}`;for(let j=1;j<pts.length;j++){const[a,c]=[pts[j-1],pts[j]];if(Math.abs(a[0]-c[0])<2)d+=` L${c[0]},${c[1]}`;else{const my=(a[1]+c[1])/2,mx=(a[0]+c[0])/2;d+=` C${a[0]},${a[1]+40} ${mx},${a[1]-40>c[1]?my:a[1]} ${mx},${my} S${c[0]},${c[1]-40} ${c[0]},${c[1]}`}}
P.forEach(p=>p.setAttribute('d',d));const len=P[0].getTotalLength()||1,g=P[1];g.style.strokeDasharray=`60 ${len+60}`;g.style.setProperty('--len',len+60);g.style.setProperty('--dur',Math.max(3,Math.min(12,len/180))+'s')};
draw();addEventListener('resize',draw);document.fonts&&document.fonts.ready.then(draw);requestAnimationFrame(()=>R.classList.add('on'));
const rmq=matchMedia('(prefers-reduced-motion: reduce)');
R.querySelectorAll('.rm-node').forEach(n=>n.onclick=()=>{const li=L.children[+n.dataset.ix];if(li.hidden){const a=H.querySelector('.filter button[data-f=""]');a&&a.click()}const card=li.querySelector('.cc');card.tabIndex=-1;card.classList.remove('hl');void card.offsetWidth;card.classList.add('hl');card.scrollIntoView({behavior:rmq.matches||document.body.classList.contains('still')?'auto':'smooth',block:'center'});card.focus({preventScroll:true})})}
</script></body></html>
