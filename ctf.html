<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abad X | تحديات CTF</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css">
<style>
:root{--mono:'JetBrains Mono','Fira Code',ui-monospace,'DejaVu Sans Mono',monospace;--b:#38bdf8}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% -10%,rgba(29,111,255,.28),transparent 55%),#000}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.8))}
main{text-align:center;padding:40px 20px;width:min(560px,94vw)}
.wm{font-family:var(--mono);font-size:clamp(2.6rem,9vw,4.5rem);margin:0;color:#e8f4ff;letter-spacing:3px;text-shadow:0 0 30px rgba(56,189,248,.45);line-height:1.1}.wm b{color:var(--b);text-shadow:0 0 24px var(--b)}
.card{margin-top:34px;padding:32px 24px;border-radius:20px;background:rgba(8,14,28,.62);backdrop-filter:blur(14px);border:1px solid rgba(56,189,248,.45);box-shadow:0 0 30px rgba(56,189,248,.2)}
.card img{width:72px;filter:drop-shadow(0 0 14px rgba(56,189,248,.6))}
h2{margin:10px 0 0;font-size:1.7rem}.en{display:block;font-family:var(--mono);font-size:.85rem;color:#6f8fbd;letter-spacing:1px}
.uc{display:inline-block;margin-top:18px;border:1px dashed #1d3a66;border-radius:99px;padding:4px 16px;color:#a9c3e6}
.cur{display:inline-block;width:.55em;height:1em;background:var(--b);vertical-align:-2px;margin-inline-start:4px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.back{display:inline-block;margin-top:24px;border:1px solid #16325c;border-radius:8px;padding:6px 16px;color:#7fa3d6}.back:hover{color:var(--b);border-color:var(--b)}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style></head><body><main>
<h1 class="wm">Abad <b>X</b></h1>
<section class="card" aria-labelledby="t"><img src="assets/abadx-logo.svg" alt=""><h2 id="t">تحديات CTF <span class="en">CTF Challenges</span></h2>
<p class="uc">قيد البناء · Under construction<span class="cur" aria-hidden="true"></span></p></section>
<a class="back" href="portal.html">→ العودة إلى البوابة · Back to portal</a>
</main></body></html>
