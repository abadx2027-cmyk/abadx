<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abad X — Intro</title><link rel="icon" href="assets/abadx-logo.svg">
<script>(function(){var n=localStorage.getItem('abadx_onboarding_done')==='1'?'portal.html':'onboarding.html';window.ABX_NEXT=n;
if(sessionStorage.getItem('abadx_intro_seen')==='1'||matchMedia('(prefers-reduced-motion: reduce)').matches){sessionStorage.setItem('abadx_intro_seen','1');location.replace(n)}})();</script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:#e6f0ff}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000 url(assets/intro/abadx-intro-poster.jpg) center/cover}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.75))}
.sweep{position:fixed;inset:0;pointer-events:none;opacity:0;background:linear-gradient(100deg,transparent 40%,rgba(80,160,255,.35) 50%,transparent 60%);background-size:250% 100%;background-position:120% 0}
.mark{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);text-align:center;opacity:0;pointer-events:none}
.mark img{width:min(22vw,150px);filter:drop-shadow(0 0 18px #1d6fff) drop-shadow(0 0 40px rgba(29,111,255,.6))}
.mark h1{margin:.4em 0 0;font-size:clamp(28px,5vw,56px);letter-spacing:.12em;direction:ltr;opacity:0;text-shadow:0 0 18px #1d6fff}
.mark p{margin:.3em 0 0;color:#93c5fd;font-size:clamp(13px,1.8vw,18px);opacity:0}
.on .mark{animation:in 1.6s ease-out forwards}.on .sweep{animation:sw 1.6s ease-in-out forwards}
.on .mark h1{animation:fd .8s .8s forwards}.on .mark p{animation:fd .8s 1.3s forwards}
@keyframes in{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes sw{0%{opacity:0;background-position:120% 0}30%{opacity:1}100%{opacity:0;background-position:-20% 0}}
@keyframes fd{to{opacity:1}}
.btn{position:fixed;bottom:24px;background:rgba(3,6,13,.6);color:#e6f0ff;border:1px solid #1d6fff;border-radius:999px;padding:10px 18px;font:inherit;cursor:pointer;backdrop-filter:blur(4px)}
.btn:hover,.btn:focus-visible{background:#1d6fff;outline:none}
#skip{left:24px}#snd{right:24px;display:none}
</style></head><body>
<video id="v" playsinline preload="auto" poster="assets/intro/abadx-intro-poster.jpg"><source src="assets/intro/abadx-intro.mp4" type="video/mp4"></video>
<div class="vig"></div><div class="sweep"></div>
<div class="mark" aria-hidden="true"><img src="assets/abadx-logo.svg" alt=""><h1>Abad X</h1><p>منصة الأمن السيبراني — Cyber Security Platform</p></div>
<button class="btn" id="skip" type="button">تخطي / Skip</button>
<button class="btn" id="snd" type="button">🔊 اضغط للصوت / Tap for sound</button>
<script>
(function(){var v=document.getElementById('v'),snd=document.getElementById('snd'),done=false,shown=false;
sessionStorage.setItem('abadx_intro_seen','1');
function go(){if(done)return;done=true;document.body.style.transition='opacity .5s';document.body.style.opacity=0;setTimeout(function(){location.replace(window.ABX_NEXT)},500)}
function reveal(){if(!shown){shown=true;document.body.classList.add('on')}}
document.getElementById('skip').onclick=go;
addEventListener('keydown',function(e){if(e.key==='Escape')go()});
snd.onclick=function(){v.muted=false;snd.style.display='none'};
v.addEventListener('timeupdate',function(){if(v.duration&&v.currentTime>=v.duration-2.4)reveal()});
v.addEventListener('ended',function(){reveal();setTimeout(go,1400)});
v.addEventListener('error',function(){reveal();setTimeout(go,2500)},true);
v.muted=false;var p=v.play();
if(p&&p.catch)p.catch(function(){v.muted=true;snd.style.display='block';v.play().catch(function(){reveal();setTimeout(go,2500)})});
setTimeout(go,15000);})();
</script></body></html>
