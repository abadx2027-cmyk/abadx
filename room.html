<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><script>(function(){try{var l=localStorage.getItem("abadx-lang")==="en"?"en":"ar";var h=document.documentElement;h.lang=l;h.dir=l==="en"?"ltr":"rtl";h.setAttribute("data-lang",l)}catch(e){}})()</script><link rel="stylesheet" href="assets/i18n.css"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abad X | غرفة تعلّم</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=3">
<style>
:root{--mono:'JetBrains Mono',ui-monospace,monospace;--b:#38bdf8;--b2:#2563eb;--mut:#8aa0c2;--ok:#4ade80;--no:#f87171;--panel:rgba(10,18,34,.72)}
body{margin:0;background:radial-gradient(ellipse at 50% -8%,rgba(29,111,255,.22),transparent 55%),#03060c;color:var(--txt)}
a{color:var(--b)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px clamp(14px,3vw,34px);background:rgba(3,6,12,.82);backdrop-filter:blur(8px);border-bottom:1px solid rgba(56,189,248,.14)}
.top img{height:30px}.top .sp{margin-inline-start:auto;display:flex;gap:10px;align-items:center}
.lnk{font-size:.85rem;color:#9fb6d8;border:1px solid #16325c;border-radius:8px;padding:5px 12px}.lnk:hover{color:var(--b);border-color:var(--b)}
.wrap{display:grid;grid-template-columns:1fr minmax(360px,440px);gap:22px;max-width:1340px;margin:auto;padding:20px clamp(14px,3vw,34px) 60px;align-items:start}
/* hero */
.hero{background:linear-gradient(150deg,rgba(15,30,60,.6),rgba(5,10,22,.5));border:1px solid rgba(56,189,248,.28);border-radius:20px;padding:22px 24px;box-shadow:0 0 40px rgba(37,99,235,.12);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hex{flex:none;width:70px;height:70px;filter:drop-shadow(0 0 12px rgba(56,189,248,.6))}
.hex svg{width:100%;height:100%}
.hhead{flex:1;min-width:220px}.hhead h1{margin:0;font-size:clamp(1.4rem,3vw,2rem)}.hhead .en{font-family:var(--mono);color:var(--mut);font-size:.9rem;direction:ltr;text-align:right;display:block}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{font-size:.78rem;border:1px solid rgba(120,160,220,.28);border-radius:999px;padding:3px 11px;color:#bcd3f5;display:inline-flex;gap:5px;align-items:center}
.pill.dif{border-color:var(--ok);color:var(--ok)}.pill.pts{border-color:var(--b);color:var(--b);font-family:var(--mono)}
.ring{flex:none;display:grid;place-items:center;position:relative;width:92px;height:92px}
.ring svg{transform:rotate(-90deg)}.ring .bg2{stroke:rgba(56,189,248,.14)}.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(56,189,248,.7))}
.ring b{position:absolute;font-family:var(--mono);font-size:1.1rem;color:#dff1ff}.ring small{position:absolute;margin-top:34px;font-size:.6rem;color:var(--mut);letter-spacing:.1em}
/* tasks */
.intro{margin:18px 0 10px;color:#bcd3f5;line-height:1.9}
.task{border:1px solid rgba(120,160,220,.16);border-radius:16px;margin:14px 0;overflow:hidden;background:var(--panel);backdrop-filter:blur(8px)}
.task.done{border-color:rgba(74,222,128,.5);box-shadow:0 0 22px rgba(74,222,128,.12)}
.thead{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:none;border:0;color:var(--txt);font:inherit;padding:16px 18px;cursor:pointer}
.tnum{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:var(--b)}
.task.done .tnum{background:rgba(74,222,128,.14);border-color:var(--ok);color:var(--ok)}
.thead h2{margin:0;font-size:1.08rem;flex:1}.thead h2 .en{display:block;font-family:var(--mono);font-size:.74rem;color:var(--mut);direction:ltr;text-align:right}
.chk{flex:none;width:22px;height:22px;opacity:.25}.task.done .chk{opacity:1}
.chev{flex:none;transition:transform .3s;color:var(--mut)}.task.open .chev{transform:rotate(180deg)}
.tbody{display:none;padding:0 18px 18px;border-top:1px solid rgba(120,160,220,.12)}
.task.open .tbody{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}}
.tbody h3{color:#dff1ff;margin:16px 0 6px;font-size:1rem}
.tbody p{margin:6px 0;color:#c3d6f0;line-height:1.95}
.code{position:relative;direction:ltr;text-align:left;font-family:var(--mono);font-size:.85rem;background:#02070f;border:1px solid rgba(56,189,248,.22);border-radius:10px;padding:12px 14px;margin:10px 0;color:#a5e4ff;white-space:pre-wrap;overflow:auto}
.cpy{position:absolute;top:8px;right:8px;font-family:Cairo;font-size:.72rem;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.3);color:#bcd3f5;border-radius:7px;padding:3px 9px;cursor:pointer}
.cpy:hover{color:#fff;border-color:var(--b)}
.call{border-radius:10px;padding:11px 14px;margin:10px 0;border:1px solid;display:flex;gap:9px;line-height:1.8}
.call.tip{border-color:rgba(56,189,248,.35);background:rgba(56,189,248,.07);color:#cfeaff}
.call.warn{border-color:rgba(248,180,90,.4);background:rgba(248,150,70,.08);color:#ffdfb8}
.call b{flex:none}
.q{border:1px solid rgba(120,160,220,.16);border-radius:12px;padding:14px;margin:12px 0;background:rgba(2,8,18,.4);transition:box-shadow .25s,border-color .25s}
.q.ok{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 0 24px rgba(74,222,128,.25)}
.q.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(7px)}50%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
.q p.qt{margin:0 0 10px;color:#eaf4ff}
.qrow{display:flex;gap:8px;flex-wrap:wrap}
.qrow input{flex:1;min-width:160px;font:inherit;font-family:var(--mono);direction:ltr;text-align:left;background:#02070f;border:1px solid rgba(120,160,220,.3);color:#eaf4ff;border-radius:9px;padding:9px 12px}
.qrow input:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 2px rgba(56,189,248,.3)}
.qrow input:disabled{opacity:.7;border-color:var(--ok)}
.sub{font:inherit;font-weight:700;background:linear-gradient(90deg,var(--b2),var(--b));color:#00121f;border:0;border-radius:9px;padding:9px 18px;cursor:pointer}
.sub:disabled{background:rgba(74,222,128,.2);color:var(--ok);cursor:default}
.fb{font-size:.84rem;margin:8px 0 0;min-height:1.2em}.fb.g{color:var(--ok)}.fb.r{color:var(--no)}
.hintbtn{background:none;border:1px dashed rgba(120,160,220,.4);color:#9fb6d8;font:inherit;font-size:.78rem;border-radius:7px;padding:4px 10px;cursor:pointer;margin-top:8px}
.hintbtn:hover{border-color:var(--b);color:var(--b)}
.hinttext{margin:8px 0 0;font-size:.82rem;color:#ffe2b0;background:rgba(248,150,70,.08);border:1px solid rgba(248,180,90,.3);border-radius:8px;padding:8px 11px;display:none}
.hinttext.show{display:block}
/* terminal */
.tp{position:sticky;top:70px}
.term-wrap{background:#02070f;border:1px solid rgba(56,189,248,.4);border-radius:14px;overflow:hidden;box-shadow:0 0 36px rgba(56,189,248,.18),inset 0 0 30px rgba(37,99,235,.08)}
.tbar{display:flex;gap:6px;align-items:center;padding:9px 13px;border-bottom:1px solid rgba(56,189,248,.16);direction:ltr;font-family:var(--mono);font-size:.74rem;color:var(--mut)}
.tbar i{width:10px;height:10px;border-radius:50%;background:#1e3a5f}.tbar i:first-child{background:var(--b)}.tbar span{margin-inline-start:auto}
.term{direction:ltr;text-align:left;font-family:var(--mono);font-size:.82rem;color:#d6ecff;line-height:1.65;padding:12px 14px;height:460px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .pr{color:var(--b)}.term .er{color:var(--no)}.term .fl{color:#fde68a}.term .mut{color:#5b7396}
.tinput{display:flex;align-items:center;gap:7px;direction:ltr;border-top:1px solid rgba(56,189,248,.16);padding:9px 12px;font-family:var(--mono)}
.tinput .pr{color:var(--b);white-space:nowrap;font-size:.82rem}
.tinput input{flex:1;background:none;border:0;color:#eaf4ff;font:inherit;font-size:.82rem;outline:none}
.scan:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
.term-wrap{position:relative}
.toggle{display:none}
/* completion */
.cel{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(2,6,14,.82);backdrop-filter:blur(6px)}
.cel.show{display:grid}
.cel .box{text-align:center;max-width:440px;padding:36px 28px;border:1px solid var(--b);border-radius:22px;background:linear-gradient(160deg,rgba(15,30,60,.9),rgba(5,10,22,.95));box-shadow:0 0 60px rgba(56,189,248,.4);animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.badge{width:120px;height:120px;margin:0 auto 14px;filter:drop-shadow(0 0 18px rgba(56,189,248,.8));animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cel h2{margin:6px 0;font-size:1.7rem}.cel p{color:#bcd3f5}
.cel .cta{display:inline-block;margin-top:14px;font-weight:700;background:linear-gradient(90deg,var(--b2),var(--b));color:#00121f;border-radius:10px;padding:11px 22px}
.cel .cta.s{background:none;border:1px solid var(--b);color:#cfe6ff;margin-inline-start:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.tp{position:static}.toggle{display:inline-flex}
 .tp.drawer{position:fixed;inset:auto 0 0 0;z-index:40;max-height:78vh;background:#03060c;border-top:1px solid var(--b);border-radius:16px 16px 0 0;padding:10px;transform:translateY(102%);transition:transform .35s;box-shadow:0 -10px 40px rgba(0,0,0,.6);pointer-events:none;visibility:hidden}
 .tp.drawer.open{transform:none;pointer-events:auto;visibility:visible}.term{height:46vh}.lbody{max-height:46vh}}
.still *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

body.wide .wrap{grid-template-columns:minmax(0,1fr) minmax(400px,600px)}
.labtabs{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.labtabs button{font:inherit;font-size:.8rem;background:rgba(10,18,34,.8);border:1px solid rgba(56,189,248,.25);color:#9fb6d8;border-radius:9px;padding:5px 12px;cursor:pointer}
.labtabs button[aria-selected=true]{background:rgba(56,189,248,.14);border-color:var(--b);color:#e6f6ff;box-shadow:0 0 14px rgba(56,189,248,.25)}
.pane[hidden]{display:none}
.lab{background:#02070f;border:1px solid rgba(56,189,248,.4);border-radius:14px;overflow:hidden;box-shadow:0 0 36px rgba(56,189,248,.18),inset 0 0 30px rgba(37,99,235,.08)}
.lbody{padding:12px;max-height:620px;overflow:auto}
.lin,.lsel,.ltxt{font:inherit;font-size:.82rem;font-family:var(--mono);background:#030b18;border:1px solid rgba(120,160,220,.3);color:#eaf4ff;border-radius:8px;padding:7px 10px;direction:ltr;text-align:left;width:100%}
.lin:focus,.ltxt:focus,.lsel:focus{outline:none;border-color:var(--b);box-shadow:0 0 0 2px rgba(56,189,248,.25)}
.ltxt{min-height:150px;resize:vertical;line-height:1.55;white-space:pre;tab-size:4}
.lbtn{font:inherit;font-size:.8rem;font-weight:700;background:linear-gradient(90deg,var(--b2),var(--b));color:#00121f;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.lbtn.s{background:none;border:1px solid rgba(56,189,248,.45);color:#cfe6ff;font-weight:400}.lbtn:disabled{opacity:.5;cursor:default}
.lrow{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.lrow>.lin{flex:1;min-width:120px;width:auto}
.llab{font-size:.75rem;color:var(--mut);margin:10px 0 4px;display:block}
.lout{direction:ltr;text-align:left;font-family:var(--mono);font-size:.8rem;background:#010509;border:1px solid rgba(56,189,248,.18);border-radius:8px;padding:9px 11px;white-space:pre-wrap;word-break:break-word;color:#cfe8ff;min-height:40px;max-height:340px;overflow:auto;margin:6px 0}
.lout .er,.lab .er{color:var(--no)}.lout .ok,.lab .okc{color:var(--ok)}.lab .fl{color:#fde68a}.lab .mut{color:#5b7396}.lab .kw{color:var(--b)}
.ltable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.74rem;direction:ltr;text-align:left}
.ltable th{position:sticky;top:0;background:#071427;color:#9fd8ff;font-weight:700;padding:5px 7px;border-bottom:1px solid rgba(56,189,248,.3);white-space:nowrap}
.ltable td{padding:4px 7px;border-bottom:1px solid rgba(120,160,220,.08);white-space:nowrap;color:#cfe3fb}
.ltable tr.sel td{background:rgba(56,189,248,.16)}.ltable tbody tr{cursor:pointer}.ltable tbody tr:hover td{background:rgba(56,189,248,.07)}
.lcard{border:1px solid rgba(120,160,220,.18);border-radius:10px;padding:10px 12px;margin:10px 0;background:rgba(6,14,28,.6)}
.lcard h4{margin:0 0 6px;font-size:.9rem;color:#dff1ff}.lcard p{margin:4px 0;font-size:.8rem;color:#a9c3e6;line-height:1.7}
.tag{display:inline-block;font-family:var(--mono);font-size:.7rem;border:1px solid rgba(56,189,248,.35);border-radius:6px;padding:0 6px;color:#9fd8ff}
.ldesc{font-size:.78rem;color:var(--mut);margin:0 0 6px;line-height:1.7}

[dir=ltr] .arr{display:inline-block;transform:scaleX(-1)}
@media (max-width:640px),(pointer:coarse){.lnk{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;box-sizing:border-box}.cpy{min-height:36px;min-width:44px;padding:6px 12px}.hintbtn{min-height:44px;padding:8px 14px}.sub{min-height:44px}}
</style></head><body>
<header class="top"><img src="assets/abadx-logo.svg" alt="Abad X">
<div class="sp"><button class="lnk toggle" id="tgl" aria-expanded="false">⌨ المختبر · Lab</button><a class="lnk" href="self-learning.html"><span class="arr" aria-hidden="true">→</span> العودة للغرف · Back to rooms</a><a class="lnk" href="portal.html">البوابة · Portal</a></div></header>
<div class="wrap">
<main id="main">
<section class="hero" id="hero"></section>
<p class="intro" id="intro" data-i18n="room.loading">جارٍ تحميل الغرفة…</p>
<div class="sr" aria-live="polite" id="live"></div>
<div id="tasks"></div>
</main>
<aside class="tp" id="tp" aria-label="المختبر التفاعلي" data-i18n-aria="room.lab"><div class="labtabs" id="labtabs" role="tablist"></div><div id="panes"></div></aside>
</div>
<div class="cel" id="cel" role="dialog" aria-modal="true" aria-labelledby="celh"><div class="box">
<svg class="badge" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
<polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="#06101f" stroke="url(#bg)" stroke-width="3"/><polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="#38bdf8" stroke-opacity=".4"/><path d="M36 51 46 61 66 39" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
<h2 id="celh" data-i18n="room.complete">الغرفة مكتملة! 🎉</h2><p>أتممت <b id="celn"></b><br><span id="celp"></span></p>

<svg width="0" height="0"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs></svg>
